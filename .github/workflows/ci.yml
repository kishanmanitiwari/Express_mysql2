name: Express CI

on: push

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - Name: Checkout code
      uses: actions/checkout@v4 # Repo clone temp ubuntu VM

    - Name: Setup Node.js
      uses: action/setup-node@v4
      with:
        node-version: 22

    - Name: Install dependencies
      run: npm install

    - Name: Run tests
      run: npm test

    - Name: Build project
      run: npm run build
