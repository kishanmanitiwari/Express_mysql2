name: Express CI

on: push

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4 # Repo clone temp ubuntu VM

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22

    - name: Install dependencies
      run: npm install

    - name: Run tests
      run: npm test

    - name: Build project
      run: echo "Build Successful!"

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
    - name: Build Docker image
      run: docker build -t express-api .
