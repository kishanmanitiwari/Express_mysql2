name: Express CI

on:
  push:
    branches: [ CD ]

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4 # Repo clone temp ubuntu VM

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22

    - name: Install dependencies
      run: npm install

    - name: Run tests
      run: npm run test

  cd:
    runs-on: ubuntu-latest

    needs: - ci
    #Depeccies states this job will run after the completion of the ci job
   

    steps:
    - name: Checkout code
      uses: actions/checkout@v4 # Repo clone temp ubuntu VM

    - name: Build Docker Image
      run: docker build -t express-api .
