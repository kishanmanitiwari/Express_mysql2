name: Express CI

on:
  push:
    branches: [ CD ]

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4 # Repo clone temp ubuntu VM

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22

    - name: Install dependencies
      run: npm install

    - name: Run tests
      run: npm run test

  cd:
    runs-on: ubuntu-latest

    needs: ci
    #Depeccies states this job will run after the completion of the ci job


    steps:
    - name: Checkout code
      uses: actions/checkout@v4 # Repo clone temp ubuntu VM

    - name: Login to DockerHub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build Docker image
      run: docker build -t ${{ secrets.DOCKER_USERNAME }}/express-api:test .

    - name: Push Docker image
      run: docker push ${{ secrets.DOCKER_USERNAME }}/express-api:test

    - name: Deploy to Oracle
      uses: appleboy/ssh-action@v1.2.2

      with:
        host: ${{ secrets.ORACLE_HOST_TEST_INSTANCE }}
        username: ${{ secrets.ORACLE_USER_TEST_INSTANCE }}
        key: ${{ secrets.ORACLE_SSH_KEY_TEST_INSTANCE }}

        script: |
          cd ~
          docker compose pull
          docker compose up -d --remove-orphans
          docker image prune -f
