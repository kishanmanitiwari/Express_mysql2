services:
  mysql:
    image: mysql:8.4
    container_name: mysql

    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: coding_savvy
      MYSQL_USER: teach
      MYSQL_PASSWORD: password

    ports:
      - "3307:3306"

    volumes:
      - mysql-data:/var/lib/mysql

  backend:
    build: .

    container_name: express

    ports:
      - "3000:3000"

    env_file:
      - .env

    depends_on:
      - mysql

volumes:
  mysql-data:
